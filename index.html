<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Finder - S5</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: url('https://images.pexels.com/photos/1029796/pexels-photo-1029796.jpeg') center/cover fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(30, 30, 60, 0.55), rgba(80, 40, 90, 0.45));
      z-index: -1;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 42px 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
    }

    h1 {
      color: #5b2c6f;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    select, input {
      width: 100%;
      padding: 15px 18px;
      font-size: 1rem;
      border: 2px solid #e8d5f0;
      border-radius: 16px;
      outline: none;
      margin-bottom: 14px;
      background: #faf7fc;
      transition: all 0.25s ease;
      font-family: inherit;
      text-align: center;
      color: #333;
    }

    select:focus, input:focus {
      border-color: #9b59b6;
      background: white;
      box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.15);
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #9b59b6, #6c3483);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 10px 25px rgba(155, 89, 182, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(155, 89, 182, 0.45);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 30px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #6c3483;
      min-height: 50px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: #95a5a6;
    }

    .footer span {
      color: #9b59b6;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="card">
    <div class="icon">🎓</div>
    <h1>Group Finder</h1>
    <p class="subtitle">Semestre 5 • Linguistique & LIT</p>

    <select id="parcours">
      <option value="ling">Parcours 1 — Linguistique</option>
      <option value="lit">Parcours 2 — LIT</option>
    </select>

    <input type="text" id="lastName" placeholder="Enter your last name..." autocomplete="off">

    <button onclick="findGroup()">
      <span>🔍</span> Find My Group
    </button>

    <p id="result"></p>

    <div class="footer">
      Made for <span>S5 students</span> with 💜
    </div>
  </div>

  <script>
    function findGroup() {
      const inputName = document.getElementById("lastName").value.trim();
      const parcours = document.getElementById("parcours").value;
      const result = document.getElementById("result");

      if (!inputName) {
        result.innerText = "❌ Please enter your last name";
        return;
      }
      const name = inputName.toUpperCase();

      if (parcours === "ling") {
        if (name < "AZ") {
          result.innerText = "🎉 You are in Groupe 1\n(AA → AZ)";
        } else if (name < "DI") {
          result.innerText = "🎉 You are in Groupe 2\n(AZ → DI)";
        } else if (name < "HR") {
          result.innerText = "🎉 You are in Groupe 3\n(DI → HR)";
        } else if (name < "NI") {
          result.innerText = "🎉 You are in Groupe 4\n(HR → NI)";
        } else {
          result.innerText = "🎉 You are in Groupe 5\n(NI → Z)";
        }
      } else {
        if (name < "ER") {
          result.innerText = "🎉 You are in Groupe 1\n(AA → ER)";
        } else {
          result.innerText = "🎉 You are in Groupe 2\n(ER → Z)";
        }
      }
    }

    document.getElementById("lastName").addEventListener("keypress", function(e) {
      if (e.key === "Enter") findGroup();
    });
  </script>
</body>
</html>
